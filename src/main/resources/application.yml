spring:
  application:
    name: agentic-url-shortener
  threads:
    virtual:
      enabled: true
  datasource:
    # File-based so workflow runs (event-sourced) survive restarts. Swap for Postgres via env vars.
    url: ${DB_URL:jdbc:h2:file:./data/shortener}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only verifies the mapping matches it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  h2:
    console:
      enabled: false
  mvc:
    problemdetails:
      enabled: true

server:
  error:
    include-stacktrace: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  # Enabled for the prototype; a production profile would disable both or put them behind auth.
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  pattern:
    # Every log line carries the HTTP request id and, inside workflow execution, the run id.
    correlation: "[req=%X{requestId:-} run=%X{runId:-}] "

app:
